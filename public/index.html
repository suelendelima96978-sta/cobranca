const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function uid(){return globalThis.crypto?.randomUUID?.()||('id-'+Date.now().toString(36)+'-'+Math.random().toString(36).slice(2,10))}function today(){let d=new Date(),z=n=>String(n).padStart(2,'0');return `${d.getFullYear()}-${z(d.getMonth()+1)}-${z(d.getDate())}`}function money(n){return Number(n||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'})}function date(v){if(!v)return '—';let [y,m,d]=String(v).slice(0,10).split('-');return y&&m&&d?`${d}/${m}/${y}`:'—'}function toast(s){let el=$('toast');el.textContent=s;el.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>el.classList.remove('show'),2900)}function persist(){if(!cloudReady){toast('Aguarde a conexão antes de salvar.');return}localDirty=true;localChangeVersion++;render();clearTimeout(window.acervoSyncTimer);window.acervoSyncTimer=setTimeout(syncCloud,250)}function migrateLegacy(rows){let data=emptyDb(),people=new Map(),clients=new Map();for(const old of rows||[]){let debtorName=String(old.debtor||'Devedor sem nome'),creditorName=String(old.creditor||'Credor sem nome'),dk=debtorName.trim().toLocaleLowerCase('pt-BR'),ck=creditorName.trim().toLocaleLowerCase('pt-BR');if(!people.has(dk)){let p={id:old.debtorId||uid(),name:debtorName,cpf:String(old.cpf||'').replace(/\D/g,''),phone:old.phone||'',address:old.address||'',email:old.email||'',notes:'',archived:false,createdAt:old.createdAt||new Date().toISOString()};people.set(dk,p);data.debtors.push(p)}if(!clients.has(ck)){let p={id:old.creditorId||uid(),name:creditorName,document:'',phone:'',email:'',address:'',notes:'',archived:false,createdAt:old.createdAt||new Date().toISOString()};clients.set(ck,p);data.creditors.push(p)}data.cases.push({id:old.id||uid(),debtorId:people.get(dk).id,creditorId:clients.get(ck).id,type:old.kind||'Boleto',situation:old.stage||'Extrajudicial',status:old.status==='paid'||old.status==='settle function filteredReport(){let rows=casesWithPeople(),de=$('repDebtor')?.value||'',cr=$('repCreditor')?.value||'',from=$('repFrom')?.value||'',to=$('repTo')?.value||'',sit=$('repSituation')?.value||'',st=$('repStatus')?.value||'';return rows.filter(c=>(!de||c.debtorId===de)&&(!cr||c.creditorId===cr)&&(!from||effectiveDue(c)>=from)&&(!to||effectiveDue(c)<=to)&&(!sit||c.situation===sit)&&(!st||c.status===st))}function exportCsv(){let rows=filteredReport(),headers=['Devedor','CPF','Endereço','Telefone','Credor','Documento credor','Tipo','Forma da cobrança','Periodicidade','Vencimento próximo','Valor original','Situação','Status','Processo/referência','Observações'];let vals=rows.map(c=>[c.debtor.name,c.debtor.cpf,c.debtor.address,c.debtor.phone,c.creditor.name,c.creditor.document,c.type,periodText(c),c.chargeMode==='single'?'':(c.chargeMode==='fixed'?'Fixa':'Parcelada'),date(effectiveDue(c)),c.amount===null||c.amount===undefined?'':Number(c.amount).toFixed(2),c.situation,STATUS[c.status],c.process,c.notes]);let csv='﻿'+[headers,...vals].map(r=>r.map(x=>'"'+String(x??'').replace(/"/g,'""')+'"').join(';')).join('\r\n');download(csv,'relatorio-cobrancas-'+today()+'.csv','text/csv;charset=utf-8');toast('Relatório CSV exportado.')}function importFile(file){if(!file)return;let reader=new FileReader();reader.onload=()=>{try{let x=JSON.parse(reader.result),incoming=x.data||x;if(Array.isArray(incoming))incoming=migrateLegacy(incoming);if(incoming.debts&&!incoming.cases)incoming=migrateLegacy(incoming.debts);if(!incoming.debtors||!incoming.creditors||!incoming.cases)throw new Error('Formato de backup não reconhecido.');if(!confirm('Restaurar este backup substituirá todos os registros do acervo compartilhado. Deseja continuar?'))return;db={...emptyDb(),...incoming};persist();toast('Backup restaurado.')}catch(e){toast(e.message||'Arquivo JSON inválido.')}};reader.readAsText(file)}

function handleAction(a,id,number){if(a==='new-case')caseForm();else if(a==='new-debtor')personForm('debtor');else if(a==='new-creditor')personForm('creditor');else if(a==='edit-debtor')personForm('debtor',db.debtors.find(x=>x.id===id));else if(a==='edit-creditor')personForm('creditor',db.creditors.find(x=>x.id===id));else if(a==='edit-case')caseForm(casesWithPeople().find(x=>x.id===id));else if(a==='detail-case')detailCase(id);else if(a==='agreement')agreementForm(casesWithPeople().find(x=>x.id===id));else if(a==='archive-debtor'||a==='archive-creditor'){let arr=a==='archive-debtor'?db.debtors:db.creditors,p=arr.find(x=>x.id===id);if(p){p.archived=!p.archived;persist();toast(p.archived?'Cadastro arquivado.':'Cadastro reativado.')}}else if(a==='backup')backup();else if(a==='import')$('importFile').click();else if(a==='export-report')exportCsv();else if(a==='print-report')window.print();else if(a==='settle-case'){let c=db.cases.find(x=>x.id===id);if(c){c.status='settled';c.settledAt=today();db.events.unshift({id:uid(),caseId:id,title:'Cobrança quitada',details:`Baixa registrada em ${date(today())}`,date:new Date().toISOString()});persist();detailCase(id);toast('Baixa registrada.')}}else if(a==='pay-installment'){let i=db.installments.find(x=>x.id===id);if(i)toggleInstallment(i)}else if(a==='edit-installment'){let i=db.installments.find(x=>x.id===id);if(i)installmentForm(i)}else if(a==='pay-case-installment')toggleCaseInstallment(id,number);else if(a==='edit-case-installment')caseInstallmentForm(id,number)}document.addEventListener('click',e=>{if(e.target.closest('[data-close]')){closeModal();return}let b=e.target.closest('[data-action]');if(b)handleAction(b.dataset.action,b.dataset.id,b.dataset.number)});$('modalBack').onclick=e=>{if(e.target===$('modalBack'))closeModal()};$('importFile').onchange=e=>{importFile(e.target.files[0]);e.target.value=''};
startOnlineApp();

<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Acervo | Gestão de Cobranças</title><style>
:root{--g:#174b3f;--g2:#286250;--bg:#f5f7f5;--line:#e3e9e5;--ink:#20312b;--muted:#74817c;--white:#fff;--red:#ac4a3e}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px Arial,sans-serif}button,input,select,textarea{font:inherit}button{cursor:pointer}.layout{display:grid;grid-template-columns:230px 1fr;min-height:100vh}.side{background:var(--g);color:#fff;padding:24px 14px}.brand{font:bold 16px Georgia;margin:0 8px 30px}.nav{width:100%;border:0;background:transparent;color:#dce9e2;text-align:left;padding:11px;border-radius:7px;margin:2px 0}.nav.active,.nav:hover{background:#ffffff20;color:#fff}.main{padding:30px;max-width:1500px;width:100%}.top{display:flex;justify-content:space-between;gap:15px;align-items:flex-start}.title{font:500 30px Georgia;margin:4px 0}.muted{color:var(--muted);font-size:12px}.actions{display:flex;gap:8px;flex-wrap:wrap}.btn{border:1px solid var(--line);background:#fff;padding:9px 13px;border-radius:7px;font-weight:600;font-size:12px}.btn.primary{background:var(--g);color:#fff;border-color:var(--g)}.btn.danger{color:var(--red)}.metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:22px 0}.metric,.panel{background:#fff;border:1px solid var(--line);border-radius:10px}.metric{padding:15px}.metric b{display:block;font:24px Georgia;margin-top:7px}.panel{overflow:hidden}.head{padding:15px 17px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;gap:10px;align-items:center}.head h2{font:19px Georgia;margin:0}.toolbar{padding:12px;border-bottom:1px solid var(--line);display:flex;gap:8px;flex-wrap:wrap}.search{flex:1;min-width:200px}input,select,textarea{border:1px solid #dce4df;border-radius:7px;padding:8px;background:#fff;color:var(--ink)}table{border-collapse:collapse;width:100%;min-width:850px}th{text-align:left;background:#fbfcfb;color:#78857f;font-size:9px;letter-spacing:.1em;text-transform:uppercase;padding:10px;border-bottom:1px solid var(--line)}td{padding:11px 10px;border-bottom:1px solid #edf0ee;font-size:12px}.badge{padding:4px 8px;border-radius:15px;background:#eef1ef;font-size:10px}.settled{background:#e5f3eb;color:#2f764a}.overdue{background:#fae9e6;color:#a4463a}.modal{position:fixed;inset:0;background:#10241dcc;display:none;align-items:center;justify-content:center;padding:16px}.modal.show{display:flex}.box{width:min(720px,100%);max-height:92vh;overflow:auto;background:#fff;border-radius:12px}.boxhead{padding:17px 20px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between}.form{padding:18px 20px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.field{display:grid;gap:5px;font-size:11px;font-weight:bold}.field.full{grid-column:1/-1}.field>*{width:100%}.foot{display:flex;justify-content:flex-end;gap:8px;margin-top:18px}.toast{position:fixed;right:18px;bottom:18px;background:var(--g);color:#fff;padding:11px 14px;border-radius:7px;display:none}.toast.show{display:block}@media(max-width:850px){.layout{grid-template-columns:1fr}.side{display:flex;gap:4px;overflow:auto;padding:9px}.brand{margin:8px;white-space:nowrap}.nav{width:auto;white-space:nowrap}.main{padding:18px}.metrics{grid-template-columns:1fr 1fr}}@media(max-width:600px){.grid{grid-template-columns:1fr}.field.full{grid-column:auto}.top{display:block}.actions{margin-top:12px}}
</style></head><body><div class="layout"><aside class="side"><div class="brand">ACERVO<br><small>Gestão de Cobranças</small></div><button class="nav active" data-view="overview">Visão geral</button><button class="nav" data-view="cases">Cobranças</button><button class="nav" data-view="debtors">Devedores</button><button class="nav" data-view="creditors">Credores</button><button class="nav" data-view="reports">Relatórios</button><button class="nav" data-view="backup">Acesso e backups</button></aside><main class="main"><div id="app"></div></main></div><div class="modal" id="modal"><div class="box" id="box"></div></div><div class="toast" id="toast"></div><input id="file" type="file" accept=".json" hidden><script>
(()=>{const $=s=>document.querySelector(s),app=$('#app'),modal=$('#modal'),box=$('#box'),toastEl=$('#toast');const token=decodeURIComponent(location.hash.slice(1));const empty=()=>({debtors:[],creditors:[],cases:[],agreements:[],installments:[],events:[]});let db=empty(),rev=0,base=JSON.stringify(db),view='overview',dirty=false,busy=false;const esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const money=x=>Number(x||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});const date=x=>x?new Date(x+'T00:00:00').toLocaleDateString('pt-BR'):'—';const today=()=>new Date().toISOString().slice(0,10);function toast(s){toastEl.textContent=s;toastEl.classList.add('show');setTimeout(()=>toastEl.classList.remove('show'),2500)}function headers(){return {'Authorization':'Bearer '+token,'Content-Type':'application/json'}}async function load(){try{let r=await fetch('/api/data',{headers:headers(),cache:'no-store'});if(!r.ok)throw Error('Não foi possível conectar ao acervo compartilhado.');let x=await r.json();db={...empty(),...(x.data||{})};rev=Number(x.revision||0);base=JSON.stringify(db);render()}catch(e){app.innerHTML='<div class="panel" style="padding:30px"><h2>Acervo</h2><p>'+esc(e.message)+'</p><p class="muted">Abra o endereço compartilhado completo, com o código de acesso após #.</p></div>'}}async function save(){if(busy)return;busy=true;try{let r=await fetch('/api/data',{method:'PUT',headers:headers(),body:JSON.stringify({data:db,revision:rev})});if(r.status===409){let x=await fetch('/api/data',{headers:headers()}).then(z=>z.json());db={...empty(),...(x.data||{})};rev=Number(x.revision||0);base=JSON.stringify(db);toast('Houve uma alteração de outra pessoa. Os dados foram atualizados.');render();return}if(!r.ok)throw Error('Falha ao salvar no banco.');let x=await r.json();rev=Number(x.revision);base=JSON.stringify(db);dirty=false;toast('Alterações salvas.')}catch(e){toast(e.message)}finally{busy=false}}function mutate(fn){fn();dirty=true;render();clearTimeout(window._save);window._save=setTimeout(save,300)}function status(c){if(c.status==='settled')return '<span class="badge settled">Quitada</span>';if(c.due&&c.due<today())return '<span class="badge overdue">Vencida</span>';return '<span class="badge">Em aberto</span>'}function people(type){return db[type].filter(x=>!x.archived)}function viewTitle(){return ({overview:'Visão geral',cases:'Cobranças',debtors:'Devedores',creditors:'Credores',reports:'Relatórios',backup:'Acesso e backups'})[view]}function render(){document.querySelectorAll('.nav').forEach(b=>b.classList.toggle('active',b.dataset.view===view));if(view==='overview')overview();else if(view==='cases')cases();else if(view==='debtors')peopleView('debtors');else if(view==='creditors')peopleView('creditors');else if(view==='reports')reports();else backupView()}function overview(){let open=db.cases.filter(c=>c.status!=='settled'),over=open.filter(c=>c.due<today());app.innerHTML='<div class="top"><div><div class="muted">ACERVO</div><div class="title">Gestão de Cobranças</div><div class="muted">Controle compartilhado de devedores, credores, cobranças e acordos.</div></div><div class="actions"><button class="btn primary" onclick="window.newCase()">+ Nova cobrança</button></div></div><div class="metrics"><div class="metric">Cobranças<b>'+db.cases.length+'</b></div><div class="metric">Em aberto<b>'+open.length+'</b></div><div class="metric">Vencidas<b>'+over.length+'</b></div><div class="metric">Valor em aberto<b>'+money(open.reduce((s,c)=>s+Number(c.amount||0),0))+'</b></div></div><div class="panel"><div class="head"><h2>Últimas cobranças</h2><button class="btn" onclick="window.setView('cases')">Ver todas</button></div>'+table(db.cases.slice().sort((a,b)=>String(b.createdAt).localeCompare(String(a.createdAt))).slice(0,8))+'</div>'}function table(rows){if(!rows.length)return '<div style="padding:35px;text-align:center" class="muted">Nenhum registro.</div>';return '<div style="overflow:auto"><table><thead><tr><th>Devedor</th><th>Credor</th><th>Tipo</th><th>Vencimento</th><th>Valor</th><th>Status</th><th></th></tr></thead><tbody>'+rows.map(c=>{let d=db.debtors.find(x=>x.id===c.debtorId)||{},cr=db.creditors.find(x=>x.id===c.creditorId)||{};return '<tr><td><b>'+esc(d.name)+'</b><div class="muted">'+esc(d.cpf||'')+'</div></td><td>'+esc(cr.name)+'</td><td>'+esc(c.type)+'</td><td>'+date(c.due)+'</td><td>'+money(c.amount)+'</td><td>'+status(c)+'</td><td><button class="btn" onclick="window.editCase(\''+c.id+'\')">Editar</button></td></tr>'}).join('')+'</tbody></table></div>'}function cases(){app.innerHTML='<div class="top"><div><div class="muted">ACERVO</div><div class="title">Cobranças</div></div><div class="actions"><button class="btn primary" onclick="window.newCase()">+ Nova cobrança</button></div></div><div class="panel"><div class="toolbar"><input id="q" class="search" placeholder="Pesquisar devedor, credor, processo..." oninput="window.filterCases()"><select id="st" onchange="window.filterCases()"><option value="">Todos os status</option><option value="open">Em aberto</option><option value="settled">Quitada</option></select></div><div id="caseTable">'+table(db.cases)+'</div></div>'}window.filterCases=()=>{let q=($('#q').value||'').toLowerCase(),st=$('#st').value;let rows=db.cases.filter(c=>{let d=db.debtors.find(x=>x.id===c.debtorId)||{},cr=db.creditors.find(x=>x.id===c.creditorId)||{};return (!q||[d.name,d.cpf,cr.name,c.process,c.notes].join(' ').toLowerCase().includes(q))&&(!st||c.status===st)});$('#caseTable').innerHTML=table(rows)};function peopleView(kind){let label=kind==='debtors'?'Devedores':'Credores';app.innerHTML='<div class="top"><div><div class="muted">ACERVO</div><div class="title">'+label+'</div></div><div class="actions"><button class="btn primary" onclick="window.newPerson(\''+kind+'\')">+ Novo cadastro</button></div></div><div class="panel"><div style="overflow:auto"><table><thead><tr><th>Nome</th><th>Documento</th><th>Telefone</th><th>E-mail</th><th></th></tr></thead><tbody>'+people(kind).map(p=>'<tr><td><b>'+esc(p.name)+'</b></td><td>'+esc(p.cpf||p.document||'')+'</td><td>'+esc(p.phone||'')+'</td><td>'+esc(p.email||'')+'</td><td><button class="btn" onclick="window.editPerson(\''+kind+'\',\''+p.id+'\')">Editar</button></td></tr>').join('')+'</tbody></table></div></div>'}function modalForm(title,html,onSubmit){box.innerHTML='<div class="boxhead"><b style="font:21px Georgia">'+title+'</b><button class="btn" onclick="window.closeModal()">Fechar</button></div><div class="form">'+html+'</div>';modal.classList.add('show');onSubmit()}window.closeModal=()=>modal.classList.remove('show');function newPerson(kind,existing){let p=existing||{name:'',cpf:'',document:'',phone:'',email:'',address:'',notes:''};modalForm(kind==='debtors'?'Novo devedor':'Novo credor','<form id="pf"><div class="grid"><label class="field">Nome<input name="name" required value="'+esc(p.name)+'"></label><label class="field">'+(kind==='debtors'?'CPF':'CNPJ/Documento')+'<input name="doc" value="'+esc(p.cpf||p.document||'')+'"></label><label class="field">Telefone<input name="phone" value="'+esc(p.phone)+'"></label><label class="field">E-mail<input name="email" value="'+esc(p.email)+'"></label><label class="field full">Endereço<input name="address" value="'+esc(p.address)+'"></label><label class="field full">Observações<textarea name="notes">'+esc(p.notes)+'</textarea></label></div><div class="foot"><button class="btn primary">Salvar</button></div></form>',()=>$('#pf').onsubmit=e=>{e.preventDefault();let f=new FormData(e.currentTarget),v={id:p.id||crypto.randomUUID(),name:f.get('name'),phone:f.get('phone'),email:f.get('email'),address:f.get('address'),notes:f.get('notes'),archived:false,createdAt:p.createdAt||new Date().toISOString()};if(kind==='debtors')v.cpf=f.get('doc');else v.document=f.get('doc');mutate(()=>{let a=db[kind],i=a.findIndex(x=>x.id===v.id);i<0?a.push(v):a[i]=v});closeModal()})}window.newPerson=newPerson;window.editPerson=(k,id)=>newPerson(k,db[k].find(x=>x.id===id));function newCase(existing){let c=existing||{debtorId:'',creditorId:'',type:'Boleto',situation:'Extrajudicial',status:'open',amount:'',due:today(),process:'',notes:''};modalForm(existing?'Editar cobrança':'Nova cobrança','<form id="cf"><div class="grid"><label class="field">Devedor<select name="debtorId" required><option value="">Selecione</option>'+people('debtors').map(p=>'<option value="'+p.id+'" '+(p.id===c.debtorId?'selected':'')+'>'+esc(p.name)+'</option>').join('')+'</select></label><label class="field">Credor<select name="creditorId" required><option value="">Selecione</option>'+people('creditors').map(p=>'<option value="'+p.id+'" '+(p.id===c.creditorId?'selected':'')+'>'+esc(p.name)+'</option>').join('')+'</select></label><label class="field">Tipo<select name="type">'+['Nota promissória','Boleto','Duplicata','Cheque','Confissão de Dívida','Contrato de prestação de serviços'].map(x=>'<option '+(x===c.type?'selected':'')+'>'+x+'</option>').join('')+'</select></label><label class="field">Situação<select name="situation"><option '+(c.situation==='Extrajudicial'?'selected':'')+'>Extrajudicial</option><option '+(c.situation==='Judicial'?'selected':'')+'>Judicial</option></select></label><label class="field">Valor<input name="amount" type="number" step="0.01" value="'+esc(c.amount)+'"></label><label class="field">Vencimento<input name="due" type="date" value="'+esc(c.due)+'"></label><label class="field">Processo / referência<input name="process" value="'+esc(c.process)+'"></label><label class="field">Status<select name="status"><option value="open" '+(c.status==='open'?'selected':'')+'>Em aberto</option><option value="settled" '+(c.status==='settled'?'selected':'')+'>Quitada</option></select></label><label class="field full">Observações<textarea name="notes">'+esc(c.notes)+'</textarea></label></div><div class="foot"><button type="button" class="btn" onclick="window.closeModal()">Cancelar</button><button class="btn primary">Salvar</button></div></form>',()=>$('#cf').onsubmit=e=>{e.preventDefault();let f=new FormData(e.currentTarget),v={...c,debtorId:f.get('debtorId'),creditorId:f.get('creditorId'),type:f.get('type'),situation:f.get('situation'),status:f.get('status'),amount:Number(f.get('amount')||0),due:f.get('due'),process:f.get('process'),notes:f.get('notes'),createdAt:c.createdAt||new Date().toISOString()};mutate(()=>{let i=db.cases.findIndex(x=>x.id===v.id);i<0?db.cases.unshift({...v,id:crypto.randomUUID()}):db.cases[i]=v});closeModal()})}window.newCase=()=>newCase();window.editCase=id=>newCase(db.cases.find(x=>x.id===id));window.setView=v=>{view=v;render()};document.querySelectorAll('.nav').forEach(b=>b.onclick=()=>window.setView(b.dataset.view));function reports(){let total=db.cases.reduce((s,c)=>s+Number(c.amount||0),0),open=db.cases.filter(c=>c.status!=='settled').reduce((s,c)=>s+Number(c.amount||0),0);app.innerHTML='<div class="top"><div><div class="muted">ACERVO</div><div class="title">Relatórios</div></div><button class="btn" onclick="window.csv()">Exportar CSV</button></div><div class="metrics"><div class="metric">Total de cobranças<b>'+db.cases.length+'</b></div><div class="metric">Valor total<b>'+money(total)+'</b></div><div class="metric">Em aberto<b>'+money(open)+'</b></div><div class="metric">Quitadas<b>'+db.cases.filter(c=>c.status==='settled').length+'</b></div></div><div class="panel">'+table(db.cases)+'</div>'}window.csv=()=>{let rows=[['Devedor','Credor','Tipo','Vencimento','Valor','Status','Processo']].concat(db.cases.map(c=>{let d=db.debtors.find(x=>x.id===c.debtorId)||{},cr=db.creditors.find(x=>x.id===c.creditorId)||{};return[d.name,cr.name,c.type,c.due,c.amount,c.status,c.process]}));let s='\ufeff'+rows.map(r=>r.map(x=>'"'+String(x??'').replace(/"/g,'""')+'"').join(';')).join('\r\n'),a=document.createElement('a');a.href=URL.createObjectURL(new Blob([s],{type:'text/csv;charset=utf-8'}));a.download='relatorio-cobrancas-'+today()+'.csv';a.click()};function backupView(){app.innerHTML='<div class="top"><div><div class="muted">ACERVO</div><div class="title">Acesso e backups</div></div></div><div class="panel" style="padding:20px"><p>O acervo é compartilhado pelo link com código após #.</p><div class="actions"><button class="btn" onclick="window.backup()">Exportar backup</button><button class="btn" onclick="$('#file').click()">Importar backup</button></div><p class="muted">Não coloque chaves do Supabase no navegador.</p></div>'}window.backup=()=>{let a=document.createElement('a'),s=JSON.stringify({app:'Acervo',version:2,exportedAt:new Date().toISOString(),data:db},null,2);a.href=URL.createObjectURL(new Blob([s],{type:'application/json'}));a.download='backup-acervo-'+today()+'.json';a.click()};$('#file').onchange=e=>{let r=new FileReader();r.onload=()=>{try{let x=JSON.parse(r.result),d=x.data||x;if(!d.cases||!d.debtors||!d.creditors)throw Error('Backup inválido.');db={...empty(),...d};dirty=true;render();save()}catch(err){toast(err.message)}};r.readAsText(e.target.files[0])};window.setView=v=>{view=v;render()};render();load()})()
</script></body></html>
